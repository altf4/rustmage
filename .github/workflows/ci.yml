name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Card and interaction assurance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          code = True
          if os.environ['EVENT_NAME'] == 'pull_request':
              paths = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', 'HEAD^1', 'HEAD']).decode().split('\0')
              code = any(p and not (p.endswith('.md') or p == 'LICENSE') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('code=' + str(code).lower(), file=out)
          if not code:
              print('Documentation-only change: native build and Python tests are unnecessary.')
          PY
          git diff --check HEAD^1 HEAD

      - name: Prepare bounded Linux runner
        if: steps.scope.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          } >> "$GITHUB_ENV"

      - name: Prepare native build tools and paths
        if: steps.scope.outputs.code == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/rustmage-build-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            venv_bin="$RUNNER_TEMP/rustmage-build-venv/Scripts"
          else
            venv_bin="$RUNNER_TEMP/rustmage-build-venv/bin"
          fi
          "$venv_bin/python" -m pip install -r scripts/requirements-build.txt
          echo "$venv_bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          python - <<'PY'
          import os
          from pathlib import Path
          cache = Path.home()/'.cache/rustmage-ci'
          cache.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              print('XDG_CACHE_HOME='+cache.as_posix(), file=out)
              print('CARGO_TARGET_DIR='+(cache/'rustmage-targets/ci').as_posix(), file=out)
              print('RUSTMAGE_XMAGE_SOURCE='+(Path(os.environ['RUNNER_TEMP'])/'mage').as_posix(), file=out)
          PY

      - name: Cache downloaded Rust dependencies
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-

      - name: Fetch pinned XMage source objects
        if: steps.scope.outputs.code == 'true'
        run: |
          revision=$(python -c "import json; print(json.load(open('data/standard/xmage-inventory.json'))['xmage_source_commit'])")
          git init "$RUSTMAGE_XMAGE_SOURCE"
          git -C "$RUSTMAGE_XMAGE_SOURCE" remote add origin https://github.com/magefree/mage.git
          git -C "$RUSTMAGE_XMAGE_SOURCE" fetch --depth=1 origin "$revision"
          # Null Summoner is pinned to the immutable head of unmerged XMage PR #16468.
          git -C "$RUSTMAGE_XMAGE_SOURCE" fetch --depth=1 origin 11d430e97f277fad0fafe604fabbaa97f944d441
          # check_sources reads immutable blobs with one git cat-file process.
          # No full XMage working tree or Java build is needed.

      - name: Cache compiled Rust artifacts
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/rustmage-ci/rustmage-targets
          key: rustmage-workspace-v1-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('.cargo/config.toml', 'scripts/rustc_guard.py') }}-${{ github.sha }}
          restore-keys: |
            rustmage-workspace-v1-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('.cargo/config.toml', 'scripts/rustc_guard.py') }}-
            rustmage-workspace-v1-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Restore timestamps of verified unchanged compile inputs
        if: steps.scope.outputs.code == 'true'
        run: python scripts/build_cache.py restore --target-dir "$CARGO_TARGET_DIR"

      - name: Verify portable catalogue generation
        if: steps.scope.outputs.code == 'true'
        run: |
          python scripts/link_catalogue.py
          git diff --exit-code

      - name: Validate cards, interactions and Python API
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 33
        run: python scripts/validate.py --release --python smoke --timeout 1800 2>&1 | tee "$XDG_CACHE_HOME/validation.log"

      - name: Run Standard gameplay through the native guard
        if: steps.scope.outputs.code == 'true'
        run: python scripts/resource_guard.py -- cargo run --release --example standard -- 1

      - name: Record compile inputs for the next compatible cache
        if: success() && steps.scope.outputs.code == 'true'
        run: python scripts/build_cache.py save --target-dir "$CARGO_TARGET_DIR"

      - name: Stop any remaining build processes
        if: always() && steps.scope.outputs.code == 'true'
        run: |
          if [[ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]]; then
            systemctl --user stop rustmage-builds.slice
          fi

      - name: Preserve diagnostics
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-diagnostics-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ~/.cache/rustmage-ci/*.log
            ~/.cache/rustmage-ci/rustmage-build-reports/*.json
            ~/.cache/rustmage-ci/rustmage-validation-*/report/*
