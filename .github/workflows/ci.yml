name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Card and interaction assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          code = True
          if os.environ['EVENT_NAME'] == 'pull_request':
              paths = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', 'HEAD^1', 'HEAD']).decode().split('\0')
              code = any(p and not (p.endswith('.md') or p == 'LICENSE') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('code=' + str(code).lower(), file=out)
          if not code:
              print('Documentation-only change: native build and Python tests are unnecessary.')
          PY
          git diff --check HEAD^1 HEAD

      - name: Prepare bounded Linux runner
        if: steps.scope.outputs.code == 'true'
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          mkdir -p "$HOME/.cache/rustmage-ci"
          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "XDG_CACHE_HOME=$HOME/.cache/rustmage-ci"
            echo "RUSTMAGE_XMAGE_SOURCE=$RUNNER_TEMP/mage"
          } >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Cache downloaded Rust dependencies
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch pinned XMage source objects
        if: steps.scope.outputs.code == 'true'
        run: |
          revision=$(python3 -c "import json; print(json.load(open('data/standard/xmage-inventory.json'))['xmage_source_commit'])")
          git init "$RUSTMAGE_XMAGE_SOURCE"
          git -C "$RUSTMAGE_XMAGE_SOURCE" remote add origin https://github.com/magefree/mage.git
          git -C "$RUSTMAGE_XMAGE_SOURCE" fetch --depth=1 origin "$revision"
          # check_sources reads immutable blobs with one git cat-file process.
          # No full XMage working tree or Java build is needed.

      - name: Cache compiled Rust artifacts
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/rustmage-ci/rustmage-targets
          key: rustmage-targets-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/rustc_guard.py') }}-${{ github.sha }}
          restore-keys: |
            rustmage-targets-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/rustc_guard.py') }}-

      - name: Validate cards, interactions and Python API
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 33
        run: python3 scripts/validate.py --release --python smoke --timeout 1800 2>&1 | tee "$XDG_CACHE_HOME/validation.log"

      - name: Stop any remaining build processes
        if: always() && steps.scope.outputs.code == 'true'
        run: |
          if [[ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]]; then
            systemctl --user stop rustmage-builds.slice
          fi

      - name: Preserve diagnostics
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ~/.cache/rustmage-ci/*.log
            ~/.cache/rustmage-ci/rustmage-build-reports/*.json
            ~/.cache/rustmage-ci/rustmage-validation-*/report/*
