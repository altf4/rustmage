[workspace]
members = ["crates/engine", "crates/test-access", "crates/cards/*"]
default-members = ["."]
resolver = "3"

[package]
name = "rustmage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic, branchable Magic simulation for reinforcement learning"

[lib]
crate-type = ["rlib", "cdylib"]
test = false
doctest = false

[dependencies]
rustmage-core = { path = "crates/engine", version = "=0.1.0" }
# BEGIN GENERATED SET DEPENDENCIES
rustmage-cards-afr = { path = "crates/cards/afr", version = "=0.1.0" }
