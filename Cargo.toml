rustmage-cards-woe = { path = "crates/cards/woe", version = "=0.1.0" }
rustmage-cards-znr = { path = "crates/cards/znr", version = "=0.1.0" }
# END GENERATED SET DEPENDENCIES
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Keep repeated worktree/review builds small; opt in to symbols when debugging.
[profile.dev]
debug = false
incremental = false

[profile.test]
# Compile the engine once; bounded scenarios prioritize fast edit/test cycles.
opt-level = 0
lto = false
debug = false
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1


[dev-dependencies]
rustmage-cards-synthetic = { path = "crates/cards/synthetic", version = "=0.1.0", features = ["test-support"] }
rustmage-core = { path = "crates/engine", version = "=0.1.0", features = ["test-support"] }

# Optimize the stable runtime once; keep card definitions and test bodies cheap.
[profile.test.package.rustmage-core]
opt-level = 1
[profile.test.package."*"]
opt-level = 1

[[bin]]
name = "rustmage"
path = "src/bin/rustmage.rs"
test = false
[[bin]]
name = "coverage"
path = "src/bin/coverage.rs"
test = false
[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
test = false
