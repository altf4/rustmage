[package]
name = "rustmage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic, branchable Magic simulation for reinforcement learning"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Keep repeated worktree/review builds small; opt in to symbols when debugging.
[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1


# Optimize validation without production LTO; retain runtime correctness checks.
[profile.release-test]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
