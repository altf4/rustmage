[package]
name = "rustmage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic, branchable Magic simulation for reinforcement learning"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
lto = "thin"
codegen-units = 1

