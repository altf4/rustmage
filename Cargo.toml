rustmage-cards-frc = { path = "crates/cards/frc", version = "=0.1.0" }
rustmage-cards-hob = { path = "crates/cards/hob", version = "=0.1.0" }
rustmage-cards-hoc = { path = "crates/cards/hoc", version = "=0.1.0" }
rustmage-cards-inr = { path = "crates/cards/inr", version = "=0.1.0" }
rustmage-cards-jmp = { path = "crates/cards/jmp", version = "=0.1.0" }
rustmage-cards-lcc = { path = "crates/cards/lcc", version = "=0.1.0" }
rustmage-cards-lci = { path = "crates/cards/lci", version = "=0.1.0" }
rustmage-cards-legacy = { path = "crates/cards/legacy", version = "=0.1.0" }
rustmage-cards-m19 = { path = "crates/cards/m19", version = "=0.1.0" }
rustmage-cards-mkm = { path = "crates/cards/mkm", version = "=0.1.0" }
rustmage-cards-mom = { path = "crates/cards/mom", version = "=0.1.0" }
rustmage-cards-msc = { path = "crates/cards/msc", version = "=0.1.0" }
rustmage-cards-msh = { path = "crates/cards/msh", version = "=0.1.0" }
rustmage-cards-one = { path = "crates/cards/one", version = "=0.1.0" }
rustmage-cards-otj = { path = "crates/cards/otj", version = "=0.1.0" }
rustmage-cards-pspl = { path = "crates/cards/pspl", version = "=0.1.0" }
rustmage-cards-rix = { path = "crates/cards/rix", version = "=0.1.0" }
rustmage-cards-soc = { path = "crates/cards/soc", version = "=0.1.0" }
rustmage-cards-sos = { path = "crates/cards/sos", version = "=0.1.0" }
rustmage-cards-spm = { path = "crates/cards/spm", version = "=0.1.0" }
rustmage-cards-synthetic = { path = "crates/cards/synthetic", version = "=0.1.0" }
rustmage-cards-tdc = { path = "crates/cards/tdc", version = "=0.1.0" }
rustmage-cards-tdm = { path = "crates/cards/tdm", version = "=0.1.0" }
rustmage-cards-tla = { path = "crates/cards/tla", version = "=0.1.0" }
rustmage-cards-tle = { path = "crates/cards/tle", version = "=0.1.0" }
rustmage-cards-tmc = { path = "crates/cards/tmc", version = "=0.1.0" }
rustmage-cards-tmt = { path = "crates/cards/tmt", version = "=0.1.0" }
rustmage-cards-trk = { path = "crates/cards/trk", version = "=0.1.0" }
rustmage-cards-w17 = { path = "crates/cards/w17", version = "=0.1.0" }
rustmage-cards-woe = { path = "crates/cards/woe", version = "=0.1.0" }
rustmage-cards-znr = { path = "crates/cards/znr", version = "=0.1.0" }
# END GENERATED SET DEPENDENCIES
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Keep repeated worktree/review builds small; opt in to symbols when debugging.
[profile.dev]
debug = false
incremental = false

[profile.test]
# Compile the engine once; bounded scenarios prioritize fast edit/test cycles.
opt-level = 0
lto = false
debug = false
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1


[dev-dependencies]
rustmage-cards-synthetic = { path = "crates/cards/synthetic", version = "=0.1.0", features = ["test-support"] }
rustmage-core = { path = "crates/engine", version = "=0.1.0", features = ["test-support"] }

# Optimize the stable runtime once; keep card definitions and test bodies cheap.
[profile.test.package.rustmage-core]
opt-level = 1
[profile.test.package."*"]
opt-level = 1

[[bin]]
name = "rustmage"
path = "src/bin/rustmage.rs"
test = false
[[bin]]
name = "coverage"
path = "src/bin/coverage.rs"
test = false
[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
test = false

