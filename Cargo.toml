rustmage-cards-blb = { path = "crates/cards/blb", version = "=0.1.0" }
rustmage-cards-cmm = { path = "crates/cards/cmm", version = "=0.1.0" }
rustmage-cards-ddg = { path = "crates/cards/ddg", version = "=0.1.0" }
rustmage-cards-dft = { path = "crates/cards/dft", version = "=0.1.0" }
rustmage-cards-dsk = { path = "crates/cards/dsk", version = "=0.1.0" }
rustmage-cards-ecc = { path = "crates/cards/ecc", version = "=0.1.0" }
rustmage-cards-ecl = { path = "crates/cards/ecl", version = "=0.1.0" }
rustmage-cards-eoc = { path = "crates/cards/eoc", version = "=0.1.0" }
rustmage-cards-eoe = { path = "crates/cards/eoe", version = "=0.1.0" }
rustmage-cards-fdn = { path = "crates/cards/fdn", version = "=0.1.0" }
rustmage-cards-fin = { path = "crates/cards/fin", version = "=0.1.0" }
rustmage-cards-fra = { path = "crates/cards/fra", version = "=0.1.0" }
rustmage-cards-frc = { path = "crates/cards/frc", version = "=0.1.0" }
rustmage-cards-hob = { path = "crates/cards/hob", version = "=0.1.0" }
rustmage-cards-hoc = { path = "crates/cards/hoc", version = "=0.1.0" }
rustmage-cards-inr = { path = "crates/cards/inr", version = "=0.1.0" }
rustmage-cards-jmp = { path = "crates/cards/jmp", version = "=0.1.0" }
rustmage-cards-lcc = { path = "crates/cards/lcc", version = "=0.1.0" }
rustmage-cards-lci = { path = "crates/cards/lci", version = "=0.1.0" }
rustmage-cards-legacy = { path = "crates/cards/legacy", version = "=0.1.0" }
rustmage-cards-m19 = { path = "crates/cards/m19", version = "=0.1.0" }
rustmage-cards-mkm = { path = "crates/cards/mkm", version = "=0.1.0" }
rustmage-cards-mom = { path = "crates/cards/mom", version = "=0.1.0" }
rustmage-cards-msc = { path = "crates/cards/msc", version = "=0.1.0" }
rustmage-cards-msh = { path = "crates/cards/msh", version = "=0.1.0" }
rustmage-cards-one = { path = "crates/cards/one", version = "=0.1.0" }
rustmage-cards-otj = { path = "crates/cards/otj", version = "=0.1.0" }
rustmage-cards-pspl = { path = "crates/cards/pspl", version = "=0.1.0" }
