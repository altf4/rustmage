[package]
name = "rustmage-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[lib]
test = false
doctest = false
[features]
# Internal white-box fixtures. Never enabled by the public library's defaults.
test-support = ["dep:rustmage-test-access"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rustmage-test-access = { path = "../test-access", version = "=0.1.0", optional = true }
